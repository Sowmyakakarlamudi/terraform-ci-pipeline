name: Terraform CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout THIS repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # Step 2: Clone Terraform repo (mentor repo)
      - name: Clone Terraform Repo
        run: |
          git clone https://${{ secrets.GIT_TOKEN }}@github.com/pavan-nagula/EC2_S3_Terraform.git
          cd EC2_S3_Terraform
          ls

      # Step 3: Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Step 4: Configure AWS Credentials
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::688349428118:role/Github-Actions-Terraform-Role-1
          aws-region: us-east-1
          #aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          #aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          #aws-region: ${{ secrets.AWS_REGION }}

      # Step 5: Terraform Format Check (Validation Best Practice)
      - name: Terraform Format Check
        run: |
          cd EC2_S3_Terraform
          terraform fmt -check
          
      # Step 6: Terraform Init
      - name: Terraform Init
        run: |
          cd EC2_S3_Terraform
          terraform init
      # Step 7: Terraform Validate
      - name: Terraform Validate
        run: |
          cd EC2_S3_Terraform
          terraform validate
      # Step 8: Terraform Plan
      - name: Terraform Plan
        run: |
          cd EC2_S3_Terraform
          terraform plan

      # Step 9: Terraform Apply
      - name: Terraform Apply
        run: |
          cd EC2_S3_Terraform
          terraform apply -auto-approve
